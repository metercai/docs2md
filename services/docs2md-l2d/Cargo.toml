[package]
name = "docs2md-l2d"
version = "0.1.0"
edition = "2021"
description = "docs2md L2 service wrapper: supervises a llama-server process (PaddleOCR-VL or any OpenAI-compatible VLA) and keeps it healthy."
license = "MPL-2.0"
repository = "https://github.com/metercai/docs2md"

[[bin]]
name = "docs2md-l2d"
path = "src/main.rs"

[dependencies]
# System API bindings only (signal handling for child reaping on SIGTERM/
# SIGINT). No frameworks; the supervisor stays effectively std-only.
libc = "0.2"
# Config file parsing (TOML), same versions as the workspace root so the
# lockfile stays shared.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
