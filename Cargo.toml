[workspace]
members = [".", "crates/ocr", "services/docs2md-l2d"]
resolver = "2"

[package]
name = "docs2md"
version = "0.3.1"
edition = "2021"
description = "PDF → Markdown, three tiers: L0 native extraction / L1 embedded pure-Rust PP-OCRv6 (ONNX) / L2 external VLM service (llama-server wrapper)."
license = "MPL-2.0"
repository = "https://github.com/metercai/docs2md"
keywords = ["pdf", "markdown", "ocr", "pp-ocr", "vla"]
categories = ["command-line-utilities", "parsing"]

[lib]
name = "docs2md"
path = "src/lib.rs"

[[bin]]
name = "docs2md"
path = "src/main.rs"

[dependencies]
docs2md-ocr = { path = "crates/ocr", default-features = false }
# Base (S2): routing (detect_pdf_type_mem) + L0 extraction + positioned text.
# No `vision`/`render-pdfium` feature: pdf-inspector's `vision` feature is a
# build bug in every published version (1.17.0-1.25.2) — fusion.rs imports
# `complete_table_markdown_from_items`, which is `#[cfg(feature = "ocr")]`,
# so `vision` without `ocr` never compiles. Rendering goes directly through
# firecrawl-pdfium (the same PDFium foundation PdfiumRenderer wraps).
pdf-inspector = "1.25"
# Rendering foundation (S2): PDFium via libloading. Runtime .so discovery:
# $PDFIUM_LIB_PATH -> next to the executable -> ./target/pdfium -> system.
firecrawl-pdfium = "0.1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["json"] }
thiserror = "1"
# Indra (feature `indra`): rten inference for the embedded ONNX pipeline.
rten = { version = "0.27.0", features = ["onnx_format", "rten_format"], optional = true }
rten-tensor = { version = "0.27.0", optional = true }
# Indra: lm.npz is a zip container of npy arrays (deflate).
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }

[features]
default = ["indra"]
# The Indra L1 engine (port of the indra-ocr 1.1.2 pipeline): 8 ONNX models +
# 3 n-gram LM tables embedded in the binary under assets/models/indra/.
# ONNX INT64 tensors are imported as Int32 by rten 0.27 (onnx_loader.rs),
# so the rec model's widths/ids/topi I/O is handled as i32.
indra = ["dep:rten", "dep:rten-tensor", "dep:flate2"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 2
strip = true
