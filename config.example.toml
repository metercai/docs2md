# docs2md configuration example.
# Copy to ./docs2md.toml (or point at it with `docs2md -c <path>` /
# $DOCS2MD_CONFIG). Every field has a default; a missing file runs on
# defaults. Unknown keys are a hard error (typos fail loudly).

# ── L0: native text extraction ──────────────────────────────────────────
[l0]
# Render DPI for needs-ocr pages (shared by the L2 send and the optional
# --blocks layout relabel).
dpi = 200
# B1 heading heuristic (L0 pages only): a line is labelled `heading` when
# its median span font size is at least this many times the page's median
# font size AND at least heading_bold_frac of its spans are bold. Set
# heading_size_ratio = inf to disable (every block stays `text`).
heading_size_ratio = 1.2
# Fraction of a line's bold spans required by the heading rule above.
heading_bold_frac = 0.5

# ── L1: embedded pure-Rust PP-OCRv6 (ONNX on rten) ─────────────────────
[l1]
# PP-OCRv6 tier. "small" is embedded in the binary (the "one binary" build).
# "medium"/"tiny" are NOT embedded — selecting one requires [l1] model_dir
# pointing at a dir that contains PPOCR_v6_<tier>_rten/{det,rec}.onnx.
tier = "small"
# External model dir for a non-embedded tier (ignored when tier = "small").
# model_dir = "/path/to/rusto-models"
# External PP-DocLayout ONNX (the ~130MB layout model is NOT embedded, and is
# over GitHub's 100MB single-file limit, so it is fetched separately).
# Used ONLY by the optional `--blocks` L0 relabel (decision D): it never
# participates in tier routing. When unset, the relabel is skipped.
# layout_model = "/path/to/DocOCR/pp_doclayout_plus_l.onnx"
# Layout detector input size (long edge, pixels).
layout_target_size = 800
# Use the embedded Indra engine (feature `indra`) as the primary L1 engine.
# When false, run the PP-OCRv6-only v0.1.0 flow (the rollback path).
use_indra = true

# ── L2: external VLM service — the L3 end of the cascade (a llama-server
#    wrapper, decision E/F) ───────────────────────────────────────────────
#    [l2] holds the service connection settings; the L2→L3 criteria live
#    under [l3] below.
[l2]
# Base URL of the L2 service (OpenAI-compatible; typically launched by
# docs2md-l2d). When empty, L2 is disabled and complex pages fall back to
# L1 and are marked "needs a higher-tier OCR model".
# base_url = "http://127.0.0.1:8080"
# Model name in the chat-completion body (llama-server serves one model).
# model = "docs2md"
# Prompt prefix sent before the page image.
prompt = "OCR:"
max_tokens = 4096
timeout_secs = 120
# Probe {base_url}/health at startup; on failure L2 is treated as
# unavailable (L1 fallback) instead of failing every page. While
# llama-server is still loading the model it answers 503 — that is kept
# waiting (up to health_wait_secs) rather than treated as down.
health_check = true
# Seconds to keep probing /health through the 503 "Loading model" window.
health_wait_secs = 30

# ── Route: page-level parallelism + structural reroute ─────────────────
[route]
# Worker threads for the page loop. Each worker owns a fresh engine
# (det + rec models load per worker). 4 is the default: a 48-page doc
# runs ~34.6 s at 4 workers vs ~72.9 s serial (2.1x). Single-page inputs
# are unaffected (one worker). 1 = serial (the v0.3.0 behavior).
parallel_threads = 4
# Reroute multi-column native-text pages to L1 using pdf-inspector's free
# pages_with_columns signal (no rendering, no models). OFF by default: the
# signal mis-fires on form layouts (short scattered items trigger its
# unguarded gutter path), which degraded two OPB form pages. Enable it for
# corpora that are genuinely multi-column prose. (Upstream fix tracked.)
structure_gate = false
# Feed the page's PDF text layer into the L1 engine (T3/T4): covered lines
# take their exact text-layer characters instead of an OCR read. OFF by
# default; enable after the layer-fusion byte-parity gate.
layer_fusion = false
# T1' coverage gate (C3): reroute a usable-native-text page to L1 when its
# L0 output covers less than cov_theta of the text layer (at least
# cov_min_layer non-whitespace layer chars) — multi-column / table pages
# whose extraction the native layer flattens. ON by default (C4); set to
# `false` to disable. NOTE: cov depends on pdf-inspector's markdown
# extraction (numerator) and PDFium's per-page text (denominator,
# firecrawl-pdfium) — re-verify cov_theta when either crate is upgraded
# (calibrated on OPB-48 + the 623-page fixture, C3b plan §0.3).
coverage_gate = true
# cov threshold for the coverage gate (C3b, firecrawl denominator: the two
# broken OPB pages sit at 0.518 / 0.021, the lowest healthy page at 0.839
# on the 623-page fixture; 0.6 leaves margin on both sides).
cov_theta = 0.6
# Minimum text-layer non-whitespace chars for a page to be a coverage-gate
# candidate (excludes scans / near-empty pages, which are needs_ocr anyway).
cov_min_layer = 200

# ── L1→L2 serial metric chain (plan §2.1, calibrated on the 623-page
#    fixture corpus) ─────────────────────────────────────────────────────
# The chain is evaluated as the Indra pipeline advances and the first hit
# escalates the page to L2 (PP-OCRv6) on the same rendered image.
[route.chain]
# [det] fewer line boxes than this => L2 (a near-image page; saves the
# whole recognition pass).
det_min_lines = 3
# [script] cjk line fraction >= this => L2 (a Chinese-major page goes to
# the engine that reads Chinese better: PP-OCRv6).
cjk_line_frac = 0.5
# [script] unsure (double-read) line fraction >= this => L2 (the
# recognizer itself is uncertain on half the lines). OFF by default (None)
# since v0.3.1: the handwriting A/B showed the unsure-triggered L2 leg was
# quality-neutral to negative for text and cost 2x the time. Uncomment and
# set a number (e.g. 0.5) to re-enable the v0.3.0 behavior.
# unsure_line_frac = 0.5
# [rec] mean line conf below this => L2 (unreliable reading).
rec_hard_conf = 0.5
# [assemble] output characters below this => L2 (almost nothing read).
min_chars = 60

# ── L2→L3 criteria (plan §2.2, decision F): a weak/invalid PP-OCRv6
#    (L2) result escalates the page to the L3 VLM ─────────────────────────
[l3]
# PP-OCRv6 output characters below this => L3. An empty page (0) hits
# here, covering the mean_conf-of-empty-page = 1.0 trap.
min_chars = 30
# PP-OCRv6 mean line conf below this => L3 (non-empty pages).
hard = 0.5

# ── Output ──────────────────────────────────────────────────────────────
[output]
# Emit a <!-- page:N --> marker before each needs-ocr page.
page_markers = true
# Print a provenance/quality summary to stderr at the end.
summary = true
